<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <div class="aaa">
      <img src="./eisenhower-matrix.jpg" alt="Image of the eisenhower matrix" />
      <a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details&quest;
      </a>
    </div>
    <div class="centered-main-page-element">
      <p id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
      </p>
      <div class="task-row-wrapper">
        <input id="new-task" class="task" type="text" />
        <button type="button">Add</button>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox" id="task-checkbox-1" />
          <label class="task" for="task-checkbox-1">Pay Bills</label>
          <input
            type="text"
            class="task"
            aria-label="Edit task text"
            title="Edit task"
          />
          <button class="edit" type="button">Edit</button>
          <button class="delete" type="button">
            <img src="./remove.svg" alt="Remove task" />
          </button>
        </li>
        <li class="editMode">
          <input type="checkbox" id="task-checkbox-2" />
          <label class="task" for="task-checkbox-2"> Go Shopping </label>
          <input
            type="text"
            value="Go Shopping"
            class="task"
            aria-label="Edit task text"
            title="Edit task"
          />
          <button class="edit" type="button">Save</button>
          <button class="delete" type="button">
            <img src="./remove.svg" alt="Remove task" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked id="task-checkbox-3" />
          <label class="task" for="task-checkbox-3">See the Doctor</label>
          <input
            type="text"
            class="task"
            aria-label="Edit task text"
            title="Edit task"
          />
          <button class="edit" type="button">Edit</button>
          <button class="delete" type="button">
            <img src="./remove.svg" alt="Remove task" />
          </button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
